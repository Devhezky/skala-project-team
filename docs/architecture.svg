<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a45"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a50"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#14231e">Skala Project Team — architecture and trust boundaries</text>
  <text x="32" y="62" fill="#5a6b63">Dashed red lines are trust boundaries. Green arrows are the only paths that change data, and each passes a person.</text>

  <!-- Zone: untrusted inputs -->
  <rect x="32" y="90" width="220" height="610" rx="12" fill="#fff6f5" stroke="#b42318" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="48" y="116" font-weight="700" fill="#b42318">UNTRUSTED CONTENT</text>
  <text x="48" y="134" fill="#7a2e26" font-size="12">data only, never instructions</text>
  <g font-size="12.5" fill="#3b2a28">
    <rect x="52" y="152" width="180" height="44" rx="8" fill="#fff" stroke="#e8c5c1"/><text x="64" y="179">Receipt photos (nota)</text>
    <rect x="52" y="206" width="180" height="44" rx="8" fill="#fff" stroke="#e8c5c1"/><text x="64" y="233">Chat exports, voice notes</text>
    <rect x="52" y="260" width="180" height="44" rx="8" fill="#fff" stroke="#e8c5c1"/><text x="64" y="287">RAB / BOQ spreadsheets</text>
    <rect x="52" y="314" width="180" height="44" rx="8" fill="#fff" stroke="#e8c5c1"/><text x="64" y="341">Forwarded documents</text>
  </g>
  <rect x="52" y="420" width="180" height="150" rx="10" fill="#fff" stroke="#e8c5c1"/>
  <text x="64" y="444" font-weight="700" fill="#3b2a28">Telegram / WhatsApp</text>
  <text x="64" y="466" font-size="12" fill="#5a4a48">owner chat · field chats</text>
  <text x="64" y="486" font-size="12" fill="#5a4a48">(mandor, tukang)</text>
  <text x="64" y="514" font-size="11.5" fill="#7a2e26">allowlist fail-closed</text>
  <text x="64" y="532" font-size="11.5" fill="#7a2e26">rate limit per chat</text>
  <text x="64" y="550" font-size="11.5" fill="#7a2e26">webhook signature check</text>

  <!-- Zone: user's computer -->
  <rect x="290" y="90" width="520" height="610" rx="12" fill="#f4faf7" stroke="#b42318" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="306" y="116" font-weight="700" fill="#0f5a3c">USER'S COMPUTER — WorkBuddy</text>

  <rect x="310" y="132" width="480" height="250" rx="10" fill="#ffffff" stroke="#9ccfb6"/>
  <text x="326" y="156" font-weight="700" fill="#14231e">Expert Team (LLM agents)</text>
  <rect x="470" y="170" width="160" height="56" rx="9" fill="#0f7a50"/>
  <text x="550" y="194" text-anchor="middle" fill="#fff" font-weight="700">Raka · Lead</text>
  <text x="550" y="212" text-anchor="middle" fill="#d9f1e6" font-size="11.5">orchestrates · plan card</text>
  <rect x="326" y="282" width="140" height="64" rx="9" fill="#e8f3ed" stroke="#9ccfb6"/>
  <text x="396" y="306" text-anchor="middle" font-weight="700">Sari · Intake</text>
  <text x="396" y="324" text-anchor="middle" font-size="11.5" fill="#3b4a45">source per value</text>
  <text x="396" y="339" text-anchor="middle" font-size="11.5" fill="#3b4a45">flags injections</text>
  <rect x="480" y="282" width="140" height="64" rx="9" fill="#e8f3ed" stroke="#9ccfb6"/>
  <text x="550" y="306" text-anchor="middle" font-weight="700">Dimas · Analyst</text>
  <text x="550" y="324" text-anchor="middle" font-size="11.5" fill="#3b4a45">RAB, S-curve, dates</text>
  <text x="550" y="339" text-anchor="middle" font-size="11.5" fill="#3b4a45">via scripts</text>
  <rect x="634" y="282" width="140" height="64" rx="9" fill="#e8f3ed" stroke="#9ccfb6"/>
  <text x="704" y="306" text-anchor="middle" font-weight="700">Wulan · QA</text>
  <text x="704" y="324" text-anchor="middle" font-size="11.5" fill="#3b4a45">rule IDs, ≤3 rounds</text>
  <text x="704" y="339" text-anchor="middle" font-size="11.5" fill="#3b4a45">then escalate</text>
  <path d="M500 226 L410 280" stroke="#3b4a45" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)" fill="none"/>
  <path d="M550 226 L550 280" stroke="#3b4a45" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)" fill="none"/>
  <path d="M600 226 L690 280" stroke="#3b4a45" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)" fill="none"/>
  <text x="326" y="370" font-size="11.5" fill="#5a6b63">Members never talk to each other; all hand-offs go through the lead.</text>

  <rect x="310" y="400" width="480" height="160" rx="10" fill="#ffffff" stroke="#9ccfb6"/>
  <text x="326" y="424" font-weight="700" fill="#14231e">Deterministic scripts (enforce rules in code)</text>
  <g font-size="12" fill="#3b4a45">
    <text x="326" y="448">skala_client.py — read + propose only; HTTPS *.skalapro.cloud</text>
    <text x="326" y="468">skala_bridge.py — roles, no money to field chats, owner-approved sends</text>
    <text x="326" y="488">kurva_s.py · check_schedule.py — weights, holidays, Jumatan, tz</text>
    <text x="326" y="508">audit_log.py — what was seen, decided, done</text>
    <text x="326" y="528">redact() — secrets scrubbed from every output and log</text>
  </g>

  <rect x="310" y="578" width="230" height="104" rx="10" fill="#14231e"/>
  <text x="326" y="602" font-weight="700" fill="#ffffff">~/.skala-workbuddy/  (700)</text>
  <text x="326" y="624" font-size="12" fill="#cfe3da">config.json (600) — key here</text>
  <text x="326" y="642" font-size="12" fill="#cfe3da">audit.jsonl (600)</text>
  <text x="326" y="660" font-size="12" fill="#cfe3da">data/inbox · processed · outbox</text>
  <text x="326" y="676" font-size="11" fill="#8fb3a4">outside plugin folder: never committed</text>
  <rect x="560" y="578" width="230" height="104" rx="10" fill="#fff" stroke="#9ccfb6"/>
  <text x="576" y="602" font-weight="700">Excel mode (no Skala)</text>
  <text x="576" y="624" font-size="12" fill="#3b4a45">buat_excel.py → workbook with</text>
  <text x="576" y="642" font-size="12" fill="#3b4a45">live formulas + S-curve chart</text>
  <text x="576" y="662" font-size="12" fill="#3b4a45">after plan-card confirmation</text>

  <path d="M232 260 L392 280" stroke="#b42318" stroke-width="1.6" marker-end="url(#r)" fill="none"/>
  <text x="258" y="396" font-size="11.5" fill="#b42318" transform="rotate(-0 0 0)">wrapped as</text>
  <text x="258" y="410" font-size="11.5" fill="#b42318">&lt;untrusted_input&gt;</text>
  <path d="M232 495 L310 495" stroke="#b42318" stroke-width="1.6" marker-end="url(#r)" fill="none"/>

  <!-- Zone: Skala server -->
  <rect x="848" y="90" width="320" height="610" rx="12" fill="#f5f7ff" stroke="#b42318" stroke-dasharray="7 5" stroke-width="1.6"/>
  <text x="864" y="116" font-weight="700" fill="#24357a">SKALA PRO SERVER</text>
  <text x="864" y="134" font-size="12" fill="#3b4a7a">module skala_workbuddy v1.1</text>
  <rect x="868" y="152" width="280" height="132" rx="10" fill="#fff" stroke="#b9c3ee"/>
  <text x="884" y="176" font-weight="700">Agent API (key: read, propose)</text>
  <g font-size="12" fill="#3b4a7a">
    <text x="884" y="198">Skala permissions + project membership</text>
    <text x="884" y="216">finance only for invoice viewers</text>
    <text x="884" y="234">hashed keys · 90-day · 30-day idle</text>
    <text x="884" y="252">rate limits · no key in URL</text>
    <text x="884" y="270">POST /actions → PENDING (writes nothing)</text>
  </g>
  <rect x="868" y="302" width="280" height="150" rx="10" fill="#fff" stroke="#0f7a50" stroke-width="2"/>
  <text x="884" y="326" font-weight="700" fill="#0f5a3c">Approval page (logged-in person)</text>
  <g font-size="12" fill="#2f4a3f">
    <text x="884" y="348">summary rendered by Skala from payload</text>
    <text x="884" y="366">agent sources · receipt preview</text>
    <text x="884" y="384">payload hash · warnings</text>
    <text x="884" y="402">Setujui / Tolak (POST + CSRF)</text>
    <text x="884" y="420">permissions re-checked for approver</text>
    <text x="884" y="438">executed once, in a transaction</text>
  </g>
  <rect x="868" y="600" width="280" height="84" rx="10" fill="#fff" stroke="#b9c3ee"/>
  <text x="884" y="624" font-weight="700">Device login consent</text>
  <text x="884" y="644" font-size="12" fill="#3b4a7a">agent name · requester IP · scopes</text>
  <text x="884" y="662" font-size="12" fill="#3b4a7a">"code matches" checkbox · 10 min</text>
  <rect x="868" y="478" width="280" height="110" rx="10" fill="#24357a"/>
  <text x="884" y="502" font-weight="700" fill="#fff">Database</text>
  <text x="884" y="524" font-size="12" fill="#d5dcff">projects, expenses, tasks, S-curve</text>
  <text x="884" y="542" font-size="12" fill="#d5dcff">workbuddy_actions (pending → executed)</text>
  <text x="884" y="560" font-size="12" fill="#d5dcff">workbuddy_audit (every call + decision)</text>
  <text x="884" y="578" font-size="12" fill="#d5dcff">keys stored as SHA-256 only</text>

  <!-- arrows to server -->
  <path d="M790 470 C 830 470, 830 220, 866 220" stroke="#3b4a45" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
  <text x="800" y="300" font-size="11.5" fill="#3b4a45" transform="rotate(-90 800 300)">read · propose</text>
  <path d="M1008 284 L1008 300" stroke="#0f7a50" stroke-width="2" marker-end="url(#g)" fill="none"/>
  <path d="M1008 452 L1008 476" stroke="#0f7a50" stroke-width="2.4" marker-end="url(#g)" fill="none"/>
  <text x="1016" y="469" font-size="11.5" fill="#0f7a50" font-weight="700">only write path</text>

  <!-- the person -->
  <circle cx="1100" cy="730" r="0" fill="none"/>
  <g transform="translate(44,728)">
    <circle cx="0" cy="0" r="11" fill="#0f7a50"/>
    <text x="20" y="5" font-weight="700" fill="#0f5a3c">Person: confirms the plan card in chat, then approves in Skala. Messages to others: owner replies SETUJU &lt;code&gt; from their own chat.</text>
  </g>
</svg>
